<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nav Menu Demo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    /* small named palette, not a random gradient */
    --charcoal: #211d18;
    --paper: #efe7d8;
    --yellow: #e8b22c;
  }

  body {
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    background-color: var(--paper);
    color: #2a251e;
  }

  h1, h2, .brand {
    font-family: 'Oswald', Arial, sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* ============================
     NAVIGATION BAR
     ============================ */

  .navbar {
    position: fixed;      /* keeps it pinned while the page scrolls */
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;

    background-color: transparent;
    border-bottom: 1px solid transparent;

    transition: background-color 0.25s ease, border-color 0.25s ease;
  }

  /* toggled on by JS once the user scrolls past 50px */
  .navbar.scrolled {
    background-color: var(--charcoal);
    border-bottom: 1px solid var(--yellow);
  }

  .navbar .brand {
    color: var(--paper);
    font-size: 20px;
  }

  .nav-links {
    list-style: none;
    display: flex;
    gap: 8px;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--paper);
    font-size: 15px;
    padding: 8px 14px;
    border: 1px solid transparent;
    transition: border-color 0.2s ease, background-color 0.2s ease;
  }

  /* hover effect, pure CSS, no JS needed */
  .nav-links a:hover {
    border-color: var(--yellow);
    background-color: rgba(232, 178, 44, 0.1);
  }

  /* ============================
     DEMO CONTENT
     just enough to have something to scroll through
     ============================ */

  section {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 40px;
  }

  section:nth-child(even) {
    background-color: #e3dac8;
  }

  section h2 {
    font-size: 32px;
    margin-bottom: 12px;
  }

  section p {
    max-width: 500px;
    color: #4a4438;
  }

</style>
</head>
<body>

  <!-- ============================
       NAV MENU — reusable across every page
       ============================ -->
  <nav class="navbar" id="navbar">
    <div class="brand">Demo</div>
    <ul class="nav-links">
      <li><a href="#one">Home</a></li>
      <li><a href="#two">About</a></li>
      <li><a href="#three">Contact</a></li>
    </ul>
  </nav>

  <!-- Basic placeholder sections, just so there's something to scroll past -->
  <section id="one">
    <h2>Section One</h2>
    <p>Scroll down to see the navbar switch from transparent to solid.</p>
  </section>

  <section id="two">
    <h2>Section Two</h2>
    <p>Hover over any menu item above to see its highlight effect.</p>
  </section>

  <section id="three">
    <h2>Section Three</h2>
    <p>That's the whole demo — nav bar stays fixed the entire time.</p>
  </section>

  <script>
    const navbar = document.getElementById('navbar');

    window.addEventListener('scroll', function () {
      // add/remove the "scrolled" class based on how far down the page is
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
  </script>

</body>
</html>
